receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlphttp/datadog:
    endpoint: ${env:DD_OTLP_ENDPOINT}
    headers:
      DD-API-KEY: ${env:DD_API_KEY}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions:
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlphttp/datadog
    metrics:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlphttp/datadog
    logs:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlphttp/datadog
